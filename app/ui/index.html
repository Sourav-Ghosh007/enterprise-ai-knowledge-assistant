<!DOCTYPE html>
<html>
<head>
    <title>Enterprise AI Knowledge Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin: 10px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
        }

        #answer {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            min-height: 40px;
        }

        #sources {
            margin-top: 15px;
            color: #555;
        }

        .status {
            margin-top: 10px;
            color: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Enterprise AI Knowledge Assistant</h1>

    <div class="subtitle">
        Ask questions from your enterprise documents using AI-powered RAG.
    </div>


    <div class="section">

        <h2>Upload Document</h2>

        <input type="file" id="fileInput" accept=".pdf,.txt">

        <br>

        <button onclick="uploadDocument()">
            Upload & Index
        </button>

        <div id="uploadStatus" class="status"></div>

    </div>


    <div class="section">

        <h2>Ask a Question</h2>

        <textarea
            id="question"
            placeholder="Example: How many paid leave days do employees receive?"
        ></textarea>

        <br><br>

        <button onclick="askQuestion()">
            Ask AI
        </button>

    </div>


    <div class="section">

        <h2>Answer</h2>

        <div id="answer">
            Your answer will appear here.
        </div>

        <div id="sources"></div>

    </div>

</div>


<script>

async function askQuestion() {

    const question = document.getElementById("question").value;

    if (!question.trim()) {
        alert("Please enter a question.");
        return;
    }

    document.getElementById("answer").innerText = "Thinking...";
    document.getElementById("sources").innerHTML = "";

    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });

        const data = await response.json();

        if (!response.ok) {
            document.getElementById("answer").innerText =
                data.detail || "Something went wrong.";
            return;
        }

        document.getElementById("answer").innerText =
            data.answer;

        if (data.sources && data.sources.length > 0) {

            document.getElementById("sources").innerHTML =
                "<strong>Sources:</strong><br>" +
                data.sources.join("<br>");

        }

    } catch (error) {

        document.getElementById("answer").innerText =
            "Unable to connect to the API.";

    }
}


async function uploadDocument() {

    const fileInput = document.getElementById("fileInput");

    if (!fileInput.files.length) {
        alert("Please select a PDF or TXT file.");
        return;
    }

    const formData = new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    document.getElementById("uploadStatus").innerText =
        "Uploading and indexing...";

    try {

        const response = await fetch("/upload", {

            method: "POST",

            body: formData

        });

        const data = await response.json();

        if (!response.ok) {

            document.getElementById("uploadStatus").innerText =
                data.detail || "Upload failed.";

            return;
        }

        document.getElementById("uploadStatus").innerText =
            data.message;

    } catch (error) {

        document.getElementById("uploadStatus").innerText =
            "Unable to connect to the API.";

    }
}

</script>

</body>
</html>
